name: Daily Test Run and Email Report

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  test_and_report:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./FRONTEND
        run: npm ci

      - name: Run Tests and Generate HTML Report
        working-directory: ./FRONTEND
        # Run tests and continue on error so the email still sends if tests fail
        run: npm run test:report
        continue-on-error: true

      - name: Upload HTML Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitest-html-report
          path: ./FRONTEND/html/

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          # SMTP configuration
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Desipath Daily Frontend Test Report
          to: vivekaanand@gmail.com, vijisrk@gmail.com
          from: Desipath CI
          body: |
            Hello,

            The daily frontend test run has completed! 
            
            Because Gmail blocks zip files containing JavaScript code for security reasons, the full interactive HTML report has been saved directly to GitHub.
            
            You can view the test results and download the HTML report by visiting your GitHub Actions tab:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Best regards,
            Desipath Automated CI/CD
