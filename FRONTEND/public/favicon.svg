<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Coinbase blue gradient: deep #011082 → vivid #0052FF → bright #2C44FC -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#011082"/>
      <stop offset="55%" style="stop-color:#0052FF"/>
      <stop offset="100%" style="stop-color:#2C44FC"/>
    </linearGradient>
    <linearGradient id="txt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#A8C4FF"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="15.5" fill="url(#bg)"/>
  <text
    x="16" y="16"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14"
    font-weight="700"
    font-style="italic"
    fill="url(#txt)"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-0.5"
  >DP</text>
</svg>
